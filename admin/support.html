  <link rel="stylesheet" href="../css/tw-compat.css" />

</head>
<body>
  <aside class="a-sidebar">
    <a href="index.html" class="a-brand">
      <img src="../images/qoutur-logo-blanc.png" alt="Qoutur" />

    <nav class="a-nav">
        <a href="index.html" class=""><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></a>
        <a href="ateliers.html" class=""><i class="bi bi-shop"></i><span>Ateliers</span></a>
        <a href="commandes.html" class=""><i class="bi bi-bag-check"></i><span>Commandes</span></a>
        <a href="clients.html" class=""><i class="bi bi-people-fill"></i><span>Clients</span></a>
        <a href="finances.html" class=""><i class="bi bi-wallet2"></i><span>Finances</span></a>
        <a href="support.html" class="active"><i class="bi bi-chat-dots-fill"></i><span>Support</span><span class="a-badge">3</span></a>
        <a href="notifications.html" class=""><i class="bi bi-megaphone-fill"></i><span>Notifications</span></a>
        <a href="personnel.html" class=""><i class="bi bi-person-badge-fill"></i><span>Personnel</span></a>
    </nav>
    <div class="a-side-foot">
      <div class="a-side-user">
        <span class="a-avatar">AD</span>
        <div>
          <div style="color:#fff;font-weight:600;font-size:.9rem;">Admin Qoutur</div>
          <a href="../index.html" style="color:rgba(255,255,255,.6);font-size:.8rem;"><i class="bi bi-box-arrow-right"></i> Déconnexion</a>
        </div>
      </div>
    </div>
  </aside>
  <div class="a-backdrop"></div>

  <div class="a-main">
    <header class="a-topbar">
      <button class="a-burger" aria-label="Menu"><i class="bi bi-list"></i></button>
      <h1 class="a-title">Support</h1>
      <div class="a-search"><i class="bi bi-search"></i><input type="search" placeholder="Rechercher…" /></div>
          <div class="a-topbar-actions">
        <span class="a-lang">FR</span>
        <div class="a-dropdown">
          <button class="a-userbtn a-dd-toggle">
            <span class="a-avatar">AD</span>
            <i class="bi bi-chevron-down caret"></i>
          </button>
          <div class="a-menu">
            <div class="a-menu-head">Admin Qoutur<small>Administratrice</small></div>
            <div class="a-menu-sep"></div>
            <a href="profil.html"><i class="bi bi-person"></i> Mon profil</a>
            <a href="parametres.html"><i class="bi bi-gear"></i> Paramètres</a>
            <div class="a-menu-sep"></div>
            <a href="../index.html" class="logout"><i class="bi bi-box-arrow-right"></i> Déconnexion</a>
          </div>
        </div>
      </div>
    </header>

    <main class="a-content">
      <div class="a-page-head">
        <div>
          <h1>Support</h1>
          <p>Fils de discussion avec les tailleurs.</p>
        </div>
      </div>
      <div class="grid grid-cols-12 gap-4 a-support">
        <div class="col-span-12 lg:col-span-5">
          <div class="a-card">
            <div id="threadList"></div>
          </div>
        </div>
        <div class="col-span-12 lg:col-span-7">
          <div class="a-card a-chat" id="chatCard">
            <div class="a-chat-empty" id="chatEmpty">
              <i class="bi bi-chat-left-text"></i>
              <p class="mb-0">Sélectionnez une conversation pour l'afficher.</p>
            </div>
            <div class="a-chat-pane hidden" id="chatPane">
              <div class="a-chat-head">
                <span class="a-avatar" id="chatAvatar"></span>
                <div class="grow">
                  <div class="who" id="chatWho"></div>
                  <div class="small text-muted" id="chatWhom"></div>
                </div>
                <a href="ateliers.html" class="a-btn a-btn-ghost a-btn-sm">Voir l'atelier</a>
              </div>
              <div class="a-chat-body" id="chatBody"></div>
              <form class="a-chat-input" id="chatForm">
                <input type="text" id="chatDraft" placeholder="Écrivez votre réponse…" autocomplete="off" />
                <button type="submit" class="a-btn a-btn-primary" aria-label="Envoyer"><i class="bi bi-send"></i></button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/admin.js"></script>
  <script>
    const THREADS = [
      { id:"t1", atelier:"Atelier SISI", who:"Maître SISI", ini:"AS", time:"Il y a 12 min", unread:2,
        messages:[
          {from:"client", text:"Bonjour, j'ai un souci avec mes frais de plateforme.", time:"09:12"},
          {from:"client", text:"Je n'arrive pas à régulariser mes frais cash.", time:"09:13"}
        ]},
      { id:"t2", atelier:"Sika Prestige", who:"Sika Ahouansou", ini:"SP", time:"Il y a 1h", unread:1,
        messages:[
          {from:"client", text:"Ma demande de retrait a été rejetée, pourquoi ?", time:"08:40"}
        ]},
      { id:"t3", atelier:"Wax & Fils", who:"Ignace Dossou", ini:"WF", time:"Il y a 3h", unread:1,
        messages:[
          {from:"client", text:"Pourquoi mon compte est suspendu ?", time:"06:20"}
        ]},
      { id:"t4", atelier:"Mateta Couture", who:"Joseph Mateta", ini:"MC", time:"Il y a 1j", unread:0,
        messages:[
          {from:"client", text:"Ma demande de validation atelier est-elle en cours ?", time:"Hier 14:02"},
          {from:"admin", text:"Bonjour, votre dossier est en cours de vérification (KYC). Vous serez notifié sous 48h.", time:"Hier 15:10"}
        ]},
      { id:"t5", atelier:"Bazro Design", who:"Olivia Bazro", ini:"BD", time:"Il y a 2j", unread:0,
        messages:[
          {from:"client", text:"Ma demande de retrait n'est pas passée.", time:"Lun 10:20"},
          {from:"admin", text:"Bonjour, le solde était insuffisant au moment de la demande.", time:"Lun 10:35"}
        ]}
    ];

    const list = document.getElementById("threadList");
    const esc = (s) => (s||"").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    let currentId = null;

    function renderList() {
      list.innerHTML = THREADS.map(t => {
        const last = t.messages[t.messages.length-1];
        const active = t.id===currentId ? " active" : "";
        const unread = t.unread ? " unread" : "";
        const pill = t.unread ? `<span class="a-unread-pill">${t.unread}</span>` : `<i class="bi bi-check2-all" style="color:var(--a-muted-2);"></i>`;
        return `<div class="a-thread${unread}${active}" data-thread="${t.id}">
          <span class="a-avatar">${t.ini}</span>
          <div class="grow">
            <div class="who">${esc(t.atelier)} <span style="color:var(--a-muted-2);font-weight:500;font-size:.82rem;">· ${esc(t.who)}</span></div>
            <div class="msg">${esc(last.text)}</div>
          </div>
          <div class="meta"><div class="time">${t.time}</div><div class="mt-1">${pill}</div></div>
        </div>`;
      }).join("");
      list.querySelectorAll("[data-thread]").forEach(el =>
        el.addEventListener("click", () => openThread(el.getAttribute("data-thread"))));
    }

    function renderMessages(t) {
      const body = document.getElementById("chatBody");
      body.innerHTML = t.messages.map(m =>
        `<div class="a-bubble-row ${m.from}"><div class="a-bubble ${m.from}">${esc(m.text)}<span class="b-time">${m.time}</span></div></div>`
      ).join("");
      body.scrollTop = body.scrollHeight;
    }

    function openThread(id) {
      const t = THREADS.find(x => x.id===id);
      if (!t) return;
      currentId = id;
      t.unread = 0;                 // marquée comme lue
      document.getElementById("chatEmpty").classList.add("hidden");
      document.getElementById("chatPane").classList.remove("hidden");
      document.getElementById("chatAvatar").textContent = t.ini;
      document.getElementById("chatWho").textContent = t.atelier;
      document.getElementById("chatWhom").textContent = t.who;
      renderMessages(t);
      renderList();
      updateBadge();
    }

    function updateBadge() {
      const totalUnread = THREADS.filter(t => t.unread>0).length;
      document.querySelectorAll('.a-nav a[href="support.html"] .a-badge').forEach(b => {
        if (totalUnread) b.textContent = totalUnread; else b.remove();
      });
    }

    document.getElementById("chatForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("chatDraft");
      const txt = input.value.trim();
      if (!txt || !currentId) return;
      const t = THREADS.find(x => x.id===currentId);
      const now = new Date().toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"});
      t.messages.push({from:"admin", text:txt, time:now});
      input.value = "";
      renderMessages(t);
      renderList();
    });

    renderList();
  </script>
</body>
</html>
