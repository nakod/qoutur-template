  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

center;font:700 13px 'Inter',sans-serif;flex:none\">FK<\u002Fdiv>\n      <div>\n        <div style=\"font:600 13px 'Inter',sans-serif;color:#fff\">Fatou K.<\u002Fdiv>\n        <div style=\"font:500 11px 'Inter',sans-serif;color:rgba(255,255,255,.45)\">Administratrice<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- MAIN -->\n  <div style=\"flex:1;min-width:0;display:flex;flex-direction:column\">\n    <div style=\"height:64px;flex:none;background:#fff;border-bottom:1px solid rgba(15,42,74,.08);display:flex;align-items:center;padding:0 32px;justify-content:space-between\">\n      <div style=\"font:700 18px 'Poppins',sans-serif\">{{ pageTitle }}<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:18px\">\n        <div style=\"font:600 12px 'Inter',sans-serif;color:rgba(15,42,74,.5)\">FR<\u002Fdiv>\n        <div style=\"width:20px;height:20px\" sc-camel-dangerously-set-inner-h-t-m-l=\"{{ bellIconHtml }}\"><\u002Fdiv>\n        <div style=\"width:32px;height:32px;border-radius:50%;background:#e8c77a;color:#0f2a4a;display:flex;align-items:center;justify-content:center;font:700 13px 'Inter',sans-serif\">FK<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1;padding:32px;overflow:auto\">\n\n      <!-- ================= DASHBOARD ================= -->\n      <sc-if value=\"{{ isDashboard }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px\">\n          <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n            <div style=\"background:#fff;border-radius:14px;padding:20px;box-shadow:0 1px 2px rgba(15,42,74,.05);border:1px solid rgba(15,42,74,.06)\">\n              <div style=\"font:600 12px 'Inter',sans-serif;color:rgba(15,42,74,.5);margin-bottom:8px\">{{ k.label }}<\u002Fdiv>\n              <div style=\"font:800 26px 'Poppins',sans-serif;color:#0f2a4a\">{{ k.value }}<\u002Fdiv>\n              <div style=\"font:600 12px 'Inter',sans-serif;color:{{ k.deltaColor }};margin-top:6px\">{{ k.delta }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-bottom:24px;align-items:start\">\n          <div style=\"background:#fff;border-radius:14px;padding:24px;border:1px solid rgba(15,42,74,.06)\">\n            <div style=\"font:700 15px 'Poppins',sans-serif;margin-bottom:18px\">Commandes — 7 derniers jours<\u002Fdiv>\n            <div style=\"display:flex;align-items:flex-end;gap:14px;height:160px\">\n              <sc-for list=\"{{ chartBars }}\" as=\"bar\" hint-placeholder-count=\"7\">\n                <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end\">\n                  <div style=\"width:100%;max-width:36px;background:linear-gradient(180deg,#c9963f,#e8c77a);border-radius:6px 6px 2px 2px;height:{{ bar.height }}\"><\u002Fdiv>\n                  <div style=\"font:600 11px 'Inter',sans-serif;color:rgba(15,42,74,.45)\">{{ bar.label }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#0f2a4a;border-radius:14px;padding:22px;color:#fff\">\n            <div style=\"font:700 15px 'Poppins',sans-serif;margin-bottom:16px\">Alertes plateforme<\u002Fdiv>\n            <sc-for list=\"{{ alerts }}\" as=\"a\" hint-placeholder-count=\"3\">\n              <div sc-camel-on-click=\"{{ a.onClick }}\" style=\"display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.1);cursor:pointer\">\n                <div style=\"width:36px;height:36px;border-radius:10px;background:rgba(201,150,63,.2);flex:none;display:flex;align-items:center;justify-content:center;font:700 15px 'Inter',sans-serif;color:#e8c77a\">{{ a.icon }}<\u002Fdiv>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font:600 13px 'Inter',sans-serif\">{{ a.title }}<\u002Fdiv>\n                  <div style=\"font:500 12px 'Inter',sans-serif;color:rgba(255,255,255,.55)\">{{ a.subtitle }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font:600 18px 'Inter',sans-serif;color:rgba(255,255,255,.4)\">›<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border-radius:14px;padding:24px;border:1px solid rgba(15,42,74,.06)\">\n          <div style=\"font:700 15px 'Poppins',sans-serif;margin-bottom:16px\">Activité récente<\u002Fdiv>\n          <sc-for list=\"{{ activity }}\" as=\"ev\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid rgba(15,42,74,.06)\">\n              <div style=\"width:8px;height:8px;border-radius:50%;background:{{ ev.dotColor }};flex:none\"><\u002Fdiv>\n              <div style=\"flex:1;font:500 13px 'Inter',sans-serif\">{{ ev.text }}<\u002Fdiv>\n              <div style=\"font:500 12px 'Inter',sans-serif;color:rgba(15,42,74,.4)\">{{ ev.time }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ================= TAILLEURS LIST ================= -->\n      <sc-if value=\"{{ isTailorsList }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;gap:12px;margin-bottom:18px\">\n          <input value=\"{{ tailorSearch }}\" sc-camel-on-change=\"{{ onTailorSearch }}\" placeholder=\"Rechercher (atelier, propriétaire, ville)\" style=\"flex:1;padding:12px 16px;border-radius:10px;border:1px solid rgba(15,42,74,.15);font:500 14px 'Inter',sans-serif;background:#fff\">\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;margin-bottom:20px\">\n          <sc-for list=\"{{ tailorFilters }}\" as=\"f\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ f.onClick }}\" style=\"{{ f.style }}\">{{ f.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font:500 12px 'Inter',sans-serif;color:rgba(15,42,74,.45);margin-bottom:10px\">Affichage de {{ filteredTailorsCount }} ateliers sur 312 au total<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <sc-for list=\"{{ filteredTailors }}\" as=\"t\" hint-placeholder-count=\"6\">\n            <div sc-camel-on-click=\"{{ t.onClick }}\" style=\"background:#fff;border-radius:12px;padding:18px 20px;border:1px solid rgba(15,42,74,.06);display:flex;align-items:center;gap:16px;cursor:pointer\">\n              <div style=\"width:42px;height:42px;border-radius:50%;background:#f4efe6;color:#c9963f;display:flex;align-items:center;justify-content:center;font:700 15px 'Inter',sans-serif;flex:none\">{{ t.initial }}<\u002Fdiv>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font:700 14px 'Inter',sans-serif\">{{ t.name }}<\u002Fdiv>\n                <div style=\"font:500 12px 'Inter',sans-serif;color:rgba(15,42,74,.5)\">{{ t.owner }} · {{ t.city }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"text-align:right;min-width:90px\">\n                <div style=\"font:700 13px 'Inter',sans-serif\">{{ t.ordersLabel }}<\u002Fdiv>\n                <div style=\"font:500 11px 'Inter',sans-serif;color:rgba(15,42,74,.45)\">commandes<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"text-align:right;min-width:120px\">\n                <div style=\"font:700 13px 'Inter',sans-serif\">{{ t.revenueLabel }}<\u002Fdiv>\n                <div style=\"font:500 11px 'Inter',sans-serif;color:rgba(15,42,74,.45)\">revenu généré<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"{{ t.statusStyle }}\">{{ t.statusLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ================= TAILLEUR DETAIL ================= -->\n      <sc-if value=\"{{ isTailorDetail }}\" hint-placeholder-val=\"{{ false }}\">\n        <div sc-camel-on-click=\"{{ backToTailors }}\" style=\"display:flex;align-items:center;gap:8px;font:600 13px 'Inter',sans-serif;color:rgba(15,42,74,.6);cursor:pointer;margin-bottom:18px\">← Retour aux ateliers<\u002Fdiv>\n\n        <div style=\"background:#fff;border-radius:14px;padding:24px;border:1px solid rgba(15,42,74,.06);margin-bottom:20px;display:flex;align-items:center;gap:18px\">\n          <div style=\"width:56px;height:56px;border-radius:50%;background:#f4efe6;color:#c9963f;display:flex;align-items:center;justify-content:center;font:700 20px 'Inter',sans-serif;flex:none\">{{ selTailor.initial }}<\u002Fdiv>\n          <div style=\"flex:1\">\n            <div style=\"font:700 19px 'Poppins',sans-serif\">{{ selTailor.name }}<\u002Fdiv>\n            <div style=\"font:500 13px 'Inter',sans-serif;color:rgba(15,42,74,.5)\">{{ selTailor.owner }} · {{ selTailor.city }} · {{ selTailor.phone }}<\u002Fdiv>\n            <div style=\"font:500 12px 'Inter',sans-serif;color:rgba(15,42,74,.4);margin-top:2px\">Inscrit le {{ selTailor.joined }} · {{ selTailor.team }} membre(s) d'équipe<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ selTailor.statusStyle }}\">{{ selTailor.statusLabel }}<\u002Fdiv>\n          <sc-for list=\"{{ selTailor.actions }}\" as=\"act\" hint-placeholder-count=\"1\">\n            <button sc-camel-on-click=\"{{ act.onClick }}\" style=\"{{ act.style }}\">{{ act.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px\">\n          <div style=\"background:#fff;border-radius:12px;padding:18px;border:1px solid rgba(15,42,74,.06)\">\n            <div style=\"font:600 12px 'Inter',sans-serif;color:rgba(15,42,74,.5);margin-bottom:6px\">Commandes<\u002Fdiv>\n            <div style=\"font:800 22px 'Poppins',sans-serif\">{{ selTailor.ordersLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border-radius:12px;padding:18px;border:1px solid rgba(15,42,74,.06)\">\n            <div style=\"font:600 12px 'Inter',sans-serif;color:rgba(15,42,74,.5);margin-bottom:6px\">Revenu généré<\u002Fdiv>\n            <div style=\"font:800 22px 'Poppins',sans-serif\">{{ selTailor.revenueLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border-radius:12px;padding:18px;border:1px solid rgba(15,42,74,.06)\">\n            <div style=\"font:600 12px 'Inter',sans-serif;color:rgba(15,42,74,.5);margin-bottom:6px\">Solde portefeuille<\u002Fdiv>\n            <div style=\"font:800 22px 'Poppins',sans-serif;color:{{ selTailor.walletColor }}\">{{ selTailor.walletLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border-radius:12px;padding:18px;border:1px solid rgba(15,42,74,.06)\">\n            <div style=\"font:600 12px 'Inter',sans-serif;color:rgba(15,42,74,.5);margin-bottom:6px\">Frais dus<\u002Fdiv>\n            <div style=\"font:800 22px 'Poppins',sans-serif;color:{{ selTailor.feesColor }}\">{{ selTailor.feesLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border-radius:14px;padding:24px;border:1px solid rgba(15,42,74,.06)\">\n          <div style=\"font:700 15px 'Poppins',sans-serif;margin-bottom:14px\">Commandes récentes de cet atelier<\u002Fdiv>\n          <sc-for list=\"{{ selTailorOrders }}\" as=\"o\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid rgba(15,42,74,.06)\">\n              <div style=\"flex:1;font:600 13px 'Inter',sans-serif\">{{ o.client }}<\u002Fdiv>\n              <div style=\"font:500 12px 'Inter',sans-serif;color:rgba(15,42,74,.45)\">{{ o.date }}<\u002Fdiv>\n              <div style=\"font:700 13px 'Inter',sans-serif;min-width:90px;text-ali \n  openTailor(id){ this.setState({view:'tailor-detail', selectedTailorId:id}); }\n  backToTailors(){ this.setState({view:'tailors', selectedTailorId:null}); }\n  setTailorFilter(f){ this.setState({tailorFilter:f}); }\n  setOrderFilter(f){ this.setState({orderFilter:f}); }\n\n  updateTailorStatus(id, status){\n    this.setState(s => ({ tailors: s.tailors.map(t => t.id===id ? {...t, status} : t) }));\n  }\n  updateWithdrawal(id, status){\n    this.setState(s => ({ withdrawals: s.withdrawals.map(w => w.id===id ? {...w, status} : w) }));\n  }\n  openThread(id){ this.setState({selectedThreadId:id}); }\n  sendReply(){\n    const draft = (this.state.chatDraft || '').trim();\n    if(!draft) return;\n    this.setState(s => ({\n      threads: s.threads.map(th => th.id===s.selectedThreadId ? {...th, unread:false, messages:[...th.messages, {from:'admin', text:draft, time:\"à l'instant\"}]} : th),\n      chatDraft: ''\n    }));\n  }\n\n  statusMeta(status){\n    if(status==='active') return {label:'Actif', bg:'rgba(31,138,76,.12)', color:'#1f8a4c'};\n    if(status==='pending') return {label:'En attente', bg:'rgba(201,150,63,.15)', color:'#a8792e'};\n    return {label:'Suspendu', bg:'rgba(214,69,69,.12)', color:'#d64545'};\n  }\n  payMeta(pay){\n    if(pay==='paid') return {label:'Payé', bg:'rgba(31,138,76,.12)', color:'#1f8a4c'};\n    if(pay==='partial') return {label:'Partiel', bg:'rgba(201,150,63,.15)', color:'#a8792e'};\n    return {label:'Impayé', bg:'rgba(214,69,69,.12)', color:'#d64545'};\n  }\n  pillStyle(bg, color){\n    return `font:700 11px 'Inter',sans-serif;color:${color};background:${bg};padding:5px 12px;border-radius:20px;white-space:nowrap`;\n  }\n\n  renderVals(){\n    const s = this.state;\n    const navDefs = [\n      {key:'dashboard', label:'Dashboard', icon:NAV_ICONS.grid},\n      {key:'tailors', label:'Ateliers', icon:NAV_ICONS.scissors, badge: s.tailors.filter(t=>t.status==='pending').length || null},\n      {key:'orders', label:'Commandes', icon:NAV_ICONS.bag},\n      {key:'clients', label:'Clients', icon:NAV_ICONS.users},\n      {key:'finances', label:'Finances', icon:NAV_ICONS.wallet, badge: s.withdrawals.filter(w=>w.status==='pending').length || null},\n      {key:'support', label:'Support', icon:NAV_ICONS.chat, badge: s.threads.filter(t=>t.unread).length || null}\n    ];\n    const activeTopKey = s.view==='tailor-detail' ? 'tailors' : s.view;\n    const navItems = navDefs.map(n => ({\n      label: n.label,\n      badge: n.badge,\n      iconHtml: {__html: n.icon},\n      onClick: () => this.setView(n.key),\n      rowStyle: `display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;cursor:pointer;color:${activeTopKey===n.key?'#0f2a4a':'rgba(255,255,255,.75)'};background:${activeTopKey===n.key?'#e8c77a':'transparent'}`\n    }));\n\n    const titles = {dashboard:'Dashboard', tailors:'Ateliers', 'tailor-detail':'Détail atelier', orders:'Commandes', clients:'Clients', finances:'Finances', support:'Support'};\n\n    // Dashboard data\n    const kpis = [\n      {label:'Ateliers actifs', value:'312', delta:'+8 en attente de validation', deltaColor:'#a8792e'},\n      {label:'Commandes ce mois', value:'4 208', delta:'+12% vs mois dernier', deltaColor:'#1f8a4c'},\n      {label:'Volume (GMV)', value:'86,4 M FCFA', delta:'+9% vs mois dernier', deltaColor:'#1f8a4c'},\n      {label:'Revenu plateforme', value:fcfa(1240000), delta:'+5% vs mois dernier', deltaColor:'#1f8a4c'}\n    ];\n    const chartVals = [62,80,45,90,70,55,95];\n    const chartLabels = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];\n    const chartBars = chartVals.map((v,i)=>({height:v+'%', label:chartLabels[i]}));\n    const pendingCount = s.tailors.filter(t=>t.status==='pending').length;\n    const withdrawPendingCount = s.withdrawals.filter(w=>w.status==='pending').length;\n    const alerts = [\n      {icon:'!', title:`${pendingCount} ateliers en attente de validation`, subtitle:'KYC à vérifier', onClick:()=>this.setState({view:'tailors', tailorFilter:'pending'})},\n      {icon:'₣', title:`${withdrawPendingCount} demandes de retrait en attente`, subtitle:'À traiter sous 48h', onClick:()=>this.setView('finances')},\n      {icon:'✉', title:`${s.threads.filter(t=>t.unread).length} messages non lus`, subtitle:'Support tailleurs', onClick:()=>this.setView('support')}\n    ];\n    const activity = [\n      {text:'Chic Couture a reçu une nouvelle commande (18 000 FCFA)', time:'Il y a 12 min', dotColor:'#1f8a4c'},\n      {text:'Élégance Tailors a soumis une demande de validation', time:'Il y a 40 min', dotColor:'#a8792e'},\n      {text:'Bazro Design a demandé un retrait de 80 000 FCFA', time:'Il y a 1h', dotColor:'#c9963f'},\n      {text:'Wax & Fils a été suspendu (solde négatif prolongé)', time:'Il y a 3h', dotColor:'#d64545'},\n      {text:'Maître SISI a réglé ses frais de plateforme (100 FCFA)', time:'Il y a 5h', dotColor:'#1f8a4c'},\n      {text:'Naomi Créations a rejoint la plateforme', time:'Hier', dotColor:'#1f8a4c'}\n    ];\n\n    // Tailors list\n    const tailorFilterDefs = [\n      {key:'all', label:'Tous'},\n      {key:'active', label:'Actifs'},\n      {key:'pending', label:'En attente'},\n      {key:'suspended', label:'Suspendus'}\n    ];\n    const tailorFilters = tailorFilterDefs.map(f => ({\n      label:f.label,\n      onClick:()=>this.setTailorFilter(f.key),\n      style:`padding:9px 18px;border-radius:20px;border:1px solid ${s.tailorFilter===f.key?'#0f2a4a':'rgba(15,42,74,.15)'};background:${s.tailorFilter===f.key?'#0f2a4a':'#fff'};color:${s.tailorFilter===f.key?'#fff':'#0f2a4a'};font:600 13px 'Inter',sans-serif`\n    }));\n    const searchLower = (s.tailorSearch||'').toLowerCase();\n    const filteredTailorsRaw = s.tailors.filter(t =>\n      (s.tailorFilter==='all' || t.status===s.tailorFilter) &&\n      (!searchLower || (t.name+' '+t.owner+' '+t.city).toLowerCase().includes(searchLower))\n    );\n    const filteredTailors = filteredTailorsRaw.map(t => {\n      const meta = this.statusMeta(t.status);\n      return {\n        onClick: () => this.openTailor(t.id),\n        initial: t.name[0],\n        name: t.name, owner: t.owner, city: t.city,\n        ordersLabel: String(t.orders), revenueLabel: fcfa(t.revenue),\n        statusLabel: meta.label, statusStyle: this.pillStyle(meta.bg, meta.color)\n      };\n    });\n\n    // Tailor detail\n    const selT = s.tailors.find(t => t.id === s.selectedTailorId);\n    let selTailor = null, selTailorOrders = [], selTailorNoOrders = false;\n    if(selT){\n      const meta = this.statusMeta(selT.status);\n      const actions = [];\n      if(selT.status==='pending') actions.push({label:'Valider', onClick:()=>this.updateTailorStatus(selT.id,'active'), style:\"padding:11px 20px;border-radius:10px;border:none;background:#1f8a4c;color:#fff;font:700 13px 'Inter',sans-serif\"});\n      if(selT.status==='active') actions.push({label:'Suspendre', onClick:()=>this.updateTailorStatus(selT.id,'suspended'), style:\"padding:11px 20px;border-radius:10px;border:1px solid #d64545;background:#fff;color:#d64545;font:700 13px 'Inter',sans-serif\"});\n      if(selT.status==='suspended') actions.push({label:'Réactiver', onClick:()=>this.updateTailorStatus(selT.id,'active'), style:\"padding:11px 20px;border-radius:10px;border:none;background:#0f2a4a;color:#fff;font:700 13px 'Inter',sans-serif\"});\n      selTailor = {\n        initial: selT.name[0], name: selT.name, owner: selT.owner, city: selT.city, phone: selT.phone,\n        joined: selT.joined, team: selT.team,\n        statusLabel: meta.label, statusStyle: this.pillStyle(meta.bg, meta.color),\n        ordersLabel: String(selT.orders), revenueLabel: fcfa(selT.revenue),\n        walletLabel: fcfa(selT.wallet), walletColor: selT.wallet<0?'#d64545':'#0f2a4a',\n        feesLabel: fcfa(selT.feesDue), feesColor: selT.feesDue>0?'#d64545':'#0f2a4a',\n        actions\n      };\n      selTailorOrders = s.orders.filter(o => o.tailorName === selT.name).map(o => {\n        const pm = this.payMeta(o.pay);\n        return {client:o.client, date:o.date, amountLabel:fcfa(o.amount), payLabel:pm.label, payStyle:this.pillStyle(pm.bg, pm.color)};\n      });\n      selTailorNoOrders = selTailorOrders.length===0;\n    }\n\n    // Orders list\n    const orderFilterDefs = [\n      {key:'all', label:'Tous'},\n      {key:'unpaid', label:'Impayé'},\n      {key:'partial', label:'Partiel'},\n      {key:'paid', label:'Payé'}\n    ];\n    const orderFilters = orderFilterDefs.map(f => ({\n      label:f.label,\n      onClick:()=>this.setOrderFilter(f.key),\n      style:`padding:9px 18px;border-radius:20px;border:1px solid ${s.orderFilter===f.key?'#0f2a4a':'rgba(15,42,74,.15)'};background:${s.orderFilter===f.key?'#0f2a4a':'#fff'};color:${s.orderFilter===f.key?'#fff':'#0f2a4a'};font:600 13px 'Inter',sans-serif`\n    }));\n    const oSearch = (s.orderSearch||'').toLowerCase();\n    const filteredOrders = s.orders.filter(o =>\n      (s.orderFilter==='all' || o.pay===s.orderFilter) &&\n      (!oSearch || (o.client+' '+o.tailorName).toLowerCase().includes(oSearch))\n    ).map(o => {\n      const pm = this.payMeta(o.pay);\n      const statusColor = o.status==='Terminée' ? {bg:'rgba(31,138,76,.12)',color:'#1f8a4c'} : o.status==='Livrée' ? {bg:'rgba(15,42,74,.08)',color:'#0f2a4a'} : {bg:'rgba(201,150,63,.15)',color:'#a8792e'};\n      return {\n        initial: o.client[0].toUpperCase(), client:o.client, tailorName:o.tailorName, date:o.date,\n        amountLabel: fcfa(o.amount),\n        payLabel: pm.label, payStyle: this.pillStyle(pm.bg, pm.color),\n        orderStatusLabel: o.status, orderStatusStyle: this.pillStyle(statusColor.bg, statusColor.color)\n      };\n    });\n\n    // Clients\n    const cSearch = (s.clientSearch||'').toLowerCase();\n    const filteredClients = s.clients.filter(c => !cSearch || (c.name+' '+c.phone).toLowerCase().includes(cSearch)).map(c => ({\n      initial: c.name[0].toUpperCase(), name:c.name, phone:c.phone, city:c.city,\n      ordersLabel:String(c.orders), spentLabel:fcfa(c.spent)\n    }));\n\n    // Finances\n    const totalWallet = s.tailors.reduce((a,t)=>a+Math.max(t.wallet,0),0);\n    const totalFeesDue = s.tailors.reduce((a,t)=>a+t.feesDue,0);\n    const financeKpis = [\n      {label:'Volume total (GMV)', value:'86,4 M FCFA', color:'#0f2a4a'},\n      {label:'Revenu plateforme', value:fcfa(1240000), color:'#1f8a4c'},\n      {label:'Solde total tailleurs', value:fcfa(totalWallet), color:'#0f2a4a'},\n      {label:'Frais en attente', value:fcfa(totalFeesDue), color: totalFeesDue>0 ? '#d64545' : '#0f2a4a'}\n    ];\n    const withdrawals = s.withdrawals.map(w => {\n      let statusLabel, statusColor;\n      if(w.status==='pending'){statusLabel='En attente';statusColor={bg:'rgba(201,150,63,.15)',color:'#a8792e'};}\n      else if(w.status==='approved'){statusLabel='Approuvé';statusColor={bg:'rgba(31,138,76,.12)',color:'#1f8a4c'};}\n      else {statusLabel='Rejeté';statusColor={bg:'rgba(214,69,69,.12)',color:'#d64545'};}\n      const actions = w.status==='pending' ? [\n        {label:'Approuver', onClick:()=>this.updateWithdrawal(w.id,'approved'), style:\"padding:9px 14px;border-radius:8px;border:none;background:#1f8a4c;color:#fff;font:700 12px 'Inter',sans-serif\"},\n        {label:'Rejeter', onClick:()=>this.updateWithdrawal(w.id,'rejected'), style:\"padding:9px 14px;border-radius:8px;border:1px solid #d64545;background:#fff;color:#d64545;font:700 12px 'Inter',sans-serif\"}\n      ] : [];\n      return {tailorName:w.tailorName, date:w.date, method:w.method, amountLabel:fcfa(w.amount), statusLabel, statusStyle:this.pillStyle(statusColor.bg, statusColor.color), actions};\n    });\n    const transactions = s.transactions.map(tx => ({\n      label: tx.label, date: tx.date,\n      amountLabel: tx.amount===0 ? '—' : (tx.amount>0?'+':'') + fcfa(tx.amount),\n      color: tx.color\n    }));\n\n    // Support\n    const threads = s.threads.map(th => ({\n      onClick: () => this.openThread(th.id),\n      initial: th.tailorName[0],\n      tailorName: th.tailorName,\n      preview: th.messages[th.messages.length-1].text,\n      unread: th.unread,\n      rowStyle: `display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;border-bottom:1px solid rgba(15,42,74,.06);background:${s.selectedThreadId===th.id?'#f4efe6':'transparent'}`\n    }));\n    const selThreadRaw = s.threads.find(t => t.id === s.selectedThreadId);\n    const selThread = selThreadRaw ? {tailorName: selThreadRaw.tailorName} : {tailorName:''};\n    const selThreadMessages = selThreadRaw ? selThreadRaw.messages.map(m => ({\n      text: m.text, time: m.time,\n      wrapStyle: `display:flex;flex-direction:column;align-items:${m.from==='admin'?'flex-end':'flex-start'}`,\n      bubbleStyle: `max-width:70%;padding:11px 16px;border-radius:14px;font:500 13px 'Inter',sans-serif;background:${m.from==='admin'?'#0f2a4a':'#f4efe6'};color:${m.from==='admin'?'#fff':'#0f2a4a'}`\n    })) : [];\n\n    return {\n      pageTitle: titles[s.view] || 'Dashboard',\n      bellIconHtml: {__html: NAV_ICONS.bell},\n      navItems,\n      isDashboard: s.view==='dashboard',\n      isTailorsList: s.view==='tailors',\n      isTailorDetail: s.view==='tailor-detail',\n      isOrders: s.view==='orders',\n      isClients: s.view==='clients',\n      isFinances: s.view==='finances',\n      isSupport: s.view==='support',\n\n      kpis, chartBars, alerts, activity,\n\n      tailorSearch: s.tailorSearch,\n      onTailorSearch: e => this.setState({tailorSearch:e.target.value}),\n      tailorFilters, filteredTailors, filteredTailorsCount: filteredTailors.length,\n\n      selTailor, selTailorOrders, selTailorNoOrders, backToTailors: () => this.backToTailors(),\n\n      orderSearch: s.orderSearch,\n      onOrderSearch: e => this.setState({orderSearch:e.target.value}),\n      orderFilters, filteredOrders,\n\n      clientSearch: s.clientSearch,\n      onClientSearch: e => this.setState({clientSearch:e.target.value}),\n      filteredClients,\n\n      financeKpis, withdrawals, transactions,\n\n      threads, hasSelectedThread: !!selThreadRaw, hasNoThread: !selThreadRaw,\n      selThread, selThreadMessages,\n      chatDraft: s.chatDraft, onChatDraft: e => this.setState({chatDraft:e.target.value}),\n      sendReply: () => this.sendReply()\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
