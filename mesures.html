<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0D2845" />
  <title>Qoutur — Vos mesures</title>

  <!-- Favicon -->
  <link rel="icon" href="images/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="images/favicon-96x96.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon-180x180.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="dropdown lang-fab">
    <button type="button" class="btn btn-q-outline btn-sm dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
      <i class="bi bi-translate me-1"></i><span class="lang-current">FR</span>
    </button>
    <ul class="dropdown-menu dropdown-menu-end lang-menu">
      <li><button type="button" class="dropdown-item lang-option" data-lang="fr">🇫🇷 Français</button></li>
      <li><button type="button" class="dropdown-item lang-option" data-lang="en">🇬🇧 English</button></li>
    </ul>
  </div>

  <main class="container" style="max-width: 700px;">

    <!-- ============ EN-TÊTE ============ -->
    <div class="measure-header">
      <a href="index.html" aria-label="Retour à l'accueil">
        <img src="images/qoutur-logo.png" alt="Qoutur" class="mb-3" style="height:110px;width:auto;" />
      </a>
      <h1 class="h3 mb-1" data-i18n data-fr="Vos mesures" data-en="Your measurements">Vos mesures</h1>
      <p class="subtitle mb-1" data-i18n data-fr="Cliente SODA · Femme" data-en="Client SODA · Women">Cliente SODA · Femme</p>
      <p class="hint" data-i18n data-fr="Renseignez chaque mesure en centimètres." data-en="Enter each measurement in centimeters.">Renseignez chaque mesure en centimètres.</p>
    </div>

    <!-- ============ FORMULAIRE DE MESURES ============ -->
    <form id="measureForm">
      <div id="measureList"></div>

      <!-- Barre d'envoi -->
      <div class="measure-submit-bar">
        <button type="submit" class="btn btn-q-primary w-100 py-3">
          <i class="bi bi-send me-2"></i><span data-i18n data-fr="Envoyer mes mesures" data-en="Send my measurements">Envoyer mes mesures</span>
        </button>
      </div>
    </form>
  </main>

  <!-- ============ MODALE IMAGE D'AIDE ============ -->
  <div class="modal fade" id="guideModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0">
          <h5 class="modal-title" id="guideTitle">Mesure</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <div class="modal-body text-center">
          <img id="guideImg" src="" alt="" class="img-fluid rounded d-none" style="max-height:340px;" />
          <div id="guidePlaceholder" class="measure-guide-placeholder">
            <i class="bi bi-image"></i>
            <span data-i18n data-fr="Image d'aide à venir" data-en="Help image coming soon">Image d'aide à venir</span>
          </div>
          <p class="text-muted small mt-3 mb-0" id="guideHint"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>

  <!-- Génération des champs de mesure (repris de la capture) -->
  <script>
    const MESURES = [
      "Tour de tête","Encolure","Épaule","Longueur manche","Tour de cheville",
      "Tour de poitrine","Sous-poitrine","Tour de taille","Tour de hanches",
      "Longueur robe devant","Longueur robe dos","Tour de cuisse","Longueur jupe",
      "Longueur pantalon","Longueur genou","Longueur mollet","Tour du mollet",
      "Longueur tunique","Longueur chemise","Longueur agbada","Hauteur poitrine",
      "Hauteur taille","Hauteur bassin","Longueur cambré","Longueur manche courte",
      "Longueur manche ¾","Tour de bras","Tour du biceps","Tour d'avant poignet",
      "Tour du ventre"
    ];

    const T = {
      fr: { see: "Voir l'image", sent: "Merci ! Vos mesures ont bien été envoyées.",
            hint: (n) => "Positionnez le mètre-ruban comme indiqué pour la mesure « " + n + " »." },
      en: { see: "View image", sent: "Thank you! Your measurements have been sent.",
            hint: (n) => "Position the tape measure as shown for the « " + n + " » measurement." }
    };
    const lang = () => (window.qGetLang ? window.qGetLang() : "fr");

    // Convertit un nom de mesure en nom de fichier (ex. "Tour de tête" -> "tour-de-tete")
    const slugify = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");

    const list = document.getElementById('measureList');
    MESURES.forEach((nom, i) => {
      const id = 'm' + i;
      const card = document.createElement('div');
      card.className = 'measure-card d-flex align-items-center justify-content-between gap-3 flex-wrap';
      card.innerHTML = `
        <div>
          <label class="measure-label mb-1" for="${id}">${nom}</label>
          <button type="button" class="measure-zoom" data-nom="${nom}" data-slug="${slugify(nom)}"
                  data-bs-toggle="modal" data-bs-target="#guideModal">
            <i class="bi bi-image"></i> <span class="zoom-label">${T[lang()].see}</span>
          </button>
        </div>
        <div class="input-group measure-input-group">
          <input type="number" min="0" step="0.5" class="form-control" id="${id}"
                 name="${nom}" placeholder="0" inputmode="decimal" />
          <span class="input-group-text">CM</span>
        </div>`;
      list.appendChild(card);
    });

    // Met à jour les libellés "Voir l'image" au changement de langue (sans réinitialiser les champs)
    document.addEventListener("qlangchange", () => {
      document.querySelectorAll(".zoom-label").forEach((s) => { s.textContent = T[lang()].see; });
    });

    // Ouverture de la modale d'image d'aide
    const gImg = document.getElementById('guideImg');
    const gPh  = document.getElementById('guidePlaceholder');
    document.querySelectorAll('.measure-zoom').forEach(btn => {
      btn.addEventListener('click', () => {
        const nom = btn.dataset.nom, slug = btn.dataset.slug;
        document.getElementById('guideTitle').textContent = nom;
        document.getElementById('guideHint').textContent = T[lang()].hint(nom);
        gImg.classList.add('d-none'); gPh.classList.remove('d-none');
        gImg.onload  = () => { gImg.classList.remove('d-none'); gPh.classList.add('d-none'); };
        gImg.onerror = () => { gImg.classList.add('d-none'); gPh.classList.remove('d-none'); };
        gImg.alt = nom;
        gImg.src = "images/mesures/" + slug + ".png";
      });
    });

    // Soumission
    document.getElementById('measureForm').addEventListener('submit', (e) => {
      e.preventDefault();
      alert(T[lang()].sent);
    });
  </script>
</body>
</html>
